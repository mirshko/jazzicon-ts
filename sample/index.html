<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jazzicon-ts Example</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
    </style>
  </head>

  <body>
    <!-- dist/index.js keeps colord and mersenne-twister as external bare
         imports, so the browser needs an import map to resolve them. -->
    <script type="importmap">
      {
        "imports": {
          "colord": "https://esm.sh/colord@2.9.3",
          "mersenne-twister": "https://esm.sh/mersenne-twister@1.1.0"
        }
      }
    </script>
    <script type="module">
      import jazzicon from "../dist/index.js";

      const address = "0x8B7B2b4F7A391b6f14A81221AE0920a9735B67Fc";

      const el = jazzicon(128, parseInt(address.slice(2, 10), 16));

      document.querySelector("body").appendChild(el);
    </script>
  </body>
</html>
